name: CI

# 不在每次 push／PR 自動執行；只在發布 Release 前由 release.yml 呼叫，
# 避免把壞掉的版本發布出去。需要手動跑時可從 Actions 頁按 Run workflow。
on:
  workflow_call:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/settings/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2

      # The settings app embeds its built front end at compile time.
      - name: Build settings UI
        working-directory: apps/settings
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
