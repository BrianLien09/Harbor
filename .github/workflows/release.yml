name: Release

# 推一個和工作區版本相同的 tag（例如 v0.1.19）就會建置安裝檔並直接發布 Release。
# 只給自己與親友使用，所以不做 Windows 程式碼簽章：第一次執行時 SmartScreen
# 會提示，選「其他資訊 → 仍要執行」即可。updater 簽章（.sig）仍保留，
# 因為少了它 app 內自動更新會拒絕安裝新版。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  installer:
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/settings/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2

      # tag 與 Cargo 版本不一致時提早失敗，避免發出版本號錯亂的 Release。
      - name: Check the tag matches the workspace version
        run: |
          $version = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages |
            Where-Object name -eq 'harbor' | Select-Object -ExpandProperty version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match workspace version $version"
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Install settings dependencies
        working-directory: apps/settings
        run: pnpm install --frozen-lockfile

      # 有 TAURI_SIGNING_PRIVATE_KEY 時會一併產生 updater 用的 .sig。
      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/build-installer.ps1

      # latest.json 給 app 內 updater 讀；Harbor-Setup.exe 是官網「最新版」下載連結用的固定檔名。
      - name: Prepare release files
        run: |
          $nsis = 'target/release/bundle/nsis'
          $setup = "Harbor_${env:VERSION}_x64-setup.exe"
          $signature = Get-Content "$nsis/$setup.sig" -Raw
          $repo = "https://github.com/$env:GITHUB_REPOSITORY"
          $manifest = [ordered]@{
            version   = $env:VERSION
            notes     = "$repo/releases/tag/$env:GITHUB_REF_NAME"
            pub_date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = $signature.Trim()
                url       = "$repo/releases/download/$env:GITHUB_REF_NAME/$setup"
              }
            }
          }
          New-Item -ItemType Directory -Force upload | Out-Null
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM upload/latest.json
          Copy-Item "$nsis/$setup" upload/
          Copy-Item "$nsis/$setup.sig" upload/
          Copy-Item "$nsis/$setup" upload/Harbor-Setup.exe

          # Release 說明取自 CHANGELOG.md 中這個版本的段落（標題到下一個標題之間）。
          $lines = Get-Content CHANGELOG.md
          $start = [array]::IndexOf($lines, "## [$env:VERSION]")
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $env:VERSION" }
          $rest = $lines[($start + 1)..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern '^## \[' | Select-Object -First 1).LineNumber
          $section = if ($end) { $rest[0..($end - 2)] } else { $rest }
          $section | Set-Content -Encoding utf8NoBOM notes.md

      # 直接發布（不留草稿），官網下載連結與 app 內更新會立刻拿到新版。
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem upload).FullName `
            --notes-file notes.md --title "Harbor $env:GITHUB_REF_NAME"
